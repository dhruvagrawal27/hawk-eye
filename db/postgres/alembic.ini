# =============================================================================
# Hawk-Eye Postgres — Alembic config (DATABASE-2)
# Blueprint: Part 9.3 (app/metadata DB, l.363); Part 28.2 (classification->access).
# DDL versioning system-of-record: `alembic upgrade head` / `downgrade` are clean
# and reversible. The DB URL is read from the env in env.py (never hardcode creds).
# =============================================================================
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is injected by migrations/env.py from POSTGRES_*/DATABASE_URL env.
sqlalchemy.url =

# Migrations live under migrations/versions; one migration per logical unit.
version_path_separator = os

[post_write_hooks]
# (optional) black/ruff could run here; we lint via the repo gate instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
