# =============================================================================
# Hawk-Eye — Redis online feature store + cache config (DATABASE-2)
# Blueprint: Part 8 (Feast + Redis online store, l.301); Part 9.2 (Redis sized to
#            hold per-entity online features for the active population, l.359);
#            Part 9.3 (encryption at rest, l.363).
# -----------------------------------------------------------------------------
# Keyspace convention (published in CONTEXT.md; DATA writes, ML/BACKEND read):
#   DB 0 = Feast ONLINE serving  — feature keys "<entity>:<feature>:<window>"
#                                   (DATA config.feature_key; online key
#                                   "<entity>:<entity_key>"). No blanket eviction.
#   DB 1 = CACHE                  — derived/scratch; evictable.
# =============================================================================

# ---- auth (dev default; prod password from Vault — PLATFORM custody) ---------
# Overridden by `--requirepass` env in compose; never commit a real secret.
requirepass ${REDIS_PASSWORD}

# ---- durability: AOF + RDB (both on; survives restart) ----------------------
appendonly yes
appendfsync everysec
# RDB snapshots (point-in-time; complements AOF for restore drills, Part 9.3).
save 900 1
save 300 10
save 60 10000
dir /data
dbfilename dump.rdb
appendfilename "appendonly.aof"

# ---- memory: sized for the active-population online features -----------------
# Online features must NOT be silently evicted → volatile-lru only evicts keys
# that carry a TTL (cache/DB1), leaving untimed online features (DB0) resident.
maxmemory ${REDIS_MAXMEMORY:-512mb}
maxmemory-policy volatile-lru

# 16 logical DBs; we use 0 (online) and 1 (cache).
databases 16

# ---- hardening --------------------------------------------------------------
# Disable the most dangerous admin commands in a shared dev box (rename to empty).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
# KEYS is O(N); keep it available for dev investigation but prefer SCAN in code.

# ---- encryption-at-rest (note) ----------------------------------------------
# Redis has no native at-rest encryption: the RDB/AOF files in /data must sit on
# an ENCRYPTED VOLUME (LUKS/dm-crypt locally; in prod a KMS/HSM-backed volume —
# PLATFORM owns key custody, Part 9.3). TLS in transit is terminated by the mesh
# (mTLS, PLATFORM). 1:1 AWS swap = ElastiCache for Redis with at-rest (KMS) +
# in-transit encryption enabled (infra/terraform/modules/elasticache).
