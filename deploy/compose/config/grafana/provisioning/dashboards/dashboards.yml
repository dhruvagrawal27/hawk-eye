# Grafana dashboard provider (PLATFORM-3/29). Loads JSON dashboards from the
# repo's observability/grafana-dashboards (mounted at /var/lib/grafana/dashboards).
apiVersion: 1
providers:
  - name: hawk-eye
    orgId: 1
    folder: Hawk-Eye
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
