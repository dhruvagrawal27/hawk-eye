# Feast feature-store config (PLATFORM hosts the server; DATA owns the real repo).
# Online store = Redis (the compose `redis` service). Offline = local file (dev).
project: hawkeye
provider: local
registry: /feature_repo/data/registry.db
online_store:
  type: redis
  connection_string: "redis:6379,password=hawkeye_dev_pw"
offline_store:
  type: file
entity_key_serialization_version: 2
