# =============================================================================
# Hawk-Eye — CORE infra compose  (PLATFORM-2, blueprint Part 8 / 9.1 / 28.2)
# Kafka · Schema Registry · Flink · Redis · ClickHouse · Postgres · MinIO · Feast
# Image tags come from deploy/compose/.env (generated from the BOM by `make bom-env`).
# Ports = CONTEXT.md §7.  Each service has a healthcheck so app/platform layers can
# gate on `service_healthy`. Run: `make core-up`.
# =============================================================================
name: hawk-eye

networks:
  hawkeye:
    name: hawkeye
    driver: bridge

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  minio-data:
  redis-data:

services:
  # --- L0 transport: Kafka (KRaft, single broker for dev) --------------------
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: hawkeye-kafka
    networks: [hawkeye]
    ports:
      - "29092:29092"   # host access (advertised as localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared, not implicit (infra/kafka/topics.yaml)
      CLUSTER_ID: "HawkEyeKRaftClusterId01"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- Topic bootstrap: declares the topology's topics (Part 9.1) ------------
  kafka-init:
    image: ${KAFKA_IMAGE}
    container_name: hawkeye-kafka-init
    networks: [hawkeye]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./config/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  # --- Schema registry host (Apicurio; DATA defines schemas, Part 28.2) ------
  schema-registry:
    image: ${SCHEMA_REGISTRY_IMAGE}
    container_name: hawkeye-schema-registry
    networks: [hawkeye]
    ports:
      - "8085:8080"
    environment:
      QUARKUS_PROFILE: prod
      REGISTRY_APIS_V2_DATE_FORMAT: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- Stream processing: Flink (JobManager + TaskManager), Part 9.1 ---------
  flink-jobmanager:
    image: ${FLINK_IMAGE}
    container_name: hawkeye-flink-jobmanager
    networks: [hawkeye]
    ports:
      - "8081:8081"     # Flink UI (CONTEXT.md §7)
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.flamegraph.enabled: true
        state.backend: hashmap
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8081' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  flink-taskmanager:
    image: ${FLINK_IMAGE}
    container_name: hawkeye-flink-taskmanager
    networks: [hawkeye]
    depends_on:
      flink-jobmanager:
        condition: service_started
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1728m

  # --- Online feature store / cache: Redis (DATABASE owns config) ------------
  redis:
    image: ${REDIS_IMAGE}
    container_name: hawkeye-redis
    networks: [hawkeye]
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-hawkeye_dev_pw}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-hawkeye_dev_pw}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Analytics / investigation store: ClickHouse (DATABASE owns schema) ----
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    container_name: hawkeye-clickhouse
    networks: [hawkeye]
    ports:
      - "8123:8123"     # HTTP
      - "9000:9000"     # native
    environment:
      CLICKHOUSE_DB: hawkeye
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-hawkeye}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hawkeye_dev_pw}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --user ${CLICKHOUSE_USER:-hawkeye} --password ${CLICKHOUSE_PASSWORD:-hawkeye_dev_pw} --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- App metadata + governance DB: Postgres --------------------------------
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: hawkeye-postgres
    networks: [hawkeye]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hawkeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hawkeye_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-hawkeye}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hawkeye} -d ${POSTGRES_DB:-hawkeye}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Object store (on-prem S3): MinIO (DATABASE owns buckets) ---------------
  minio:
    image: ${MINIO_IMAGE}
    container_name: hawkeye-minio
    networks: [hawkeye]
    ports:
      - "9001:9001"     # S3 API
      - "9002:9002"     # console
    command: ["server", "/data", "--address", ":9001", "--console-address", ":9002"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hawkeye}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hawkeye_dev_pw}
      MINIO_REGION: ${AWS_REGION:-ap-south-1}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9001/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  # --- Feature server: Feast (DATA provides feature_repo; PLATFORM hosts) -----
  feast:
    build:
      context: ./config/feast
      dockerfile: Dockerfile
    image: hawkeye/feast:0.40.1
    container_name: hawkeye-feast
    networks: [hawkeye]
    ports:
      - "6566:6566"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hawkeye_dev_pw}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6566' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
