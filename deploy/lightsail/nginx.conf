# Hawk-Eye pilot reverse proxy: serves the SPA and proxies API/WS to the backend.
# The ML narrative gateway is NOT exposed publicly — only the backend talks to it
# (server-to-server inside the compose network).
server {
    listen 80;
    server_name _;

    # Security headers (defence in depth; TLS itself is terminated by Lightsail/your LB).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- REST API -> FastAPI control plane (mounts under /api/v1) ----
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- WebSocket (live alert stream) ----
    location /ws/ {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # ---- health passthrough (handy for the load balancer) ----
    location = /healthz {
        proxy_pass http://backend:8000/health;
    }

    # ---- the React SPA (client-side routing -> always fall back to index.html) ----
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
