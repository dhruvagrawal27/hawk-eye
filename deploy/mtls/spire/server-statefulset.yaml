# =============================================================================
# Hawk-Eye — SPIRE Server StatefulSet + Service + RBAC (SCAFFOLD)
# Owner: PLATFORM (Laptop 06)  ·  Task: PLATFORM-11  ·  Blueprint: Part 26.2 (mTLS),
#        Part 9.3, Part 19.3, Part 16 (in-India residency)
# -----------------------------------------------------------------------------
# SCAFFOLD real-fabric SPIFFE/SPIRE control plane (replaces ./gen-certs.sh dev CA).
# Image pinned in deploy/versions.bom.yaml: ghcr.io/spiffe/spire-server:1.11.0.
# Consumes ./server-configmap.yaml. Plan-only; apply on the real cluster only.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
  labels: { app.kubernetes.io/part-of: hawk-eye, app.kubernetes.io/name: spire-server, data-residency: in-india, region: ap-south-1 }
automountServiceAccountToken: true   # SPIRE server DOES call the k8s API (PSAT review)
---
# Least-privilege: only the TokenReview the PSAT node-attestor needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-trust-role
  labels: { app.kubernetes.io/part-of: hawk-eye }
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-trust-role-binding
  labels: { app.kubernetes.io/part-of: hawk-eye }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-trust-role
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
  labels: { app.kubernetes.io/part-of: hawk-eye, app.kubernetes.io/name: spire-server, data-residency: in-india, region: ap-south-1 }
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
  labels: { app.kubernetes.io/part-of: hawk-eye, app.kubernetes.io/name: spire-server, data-residency: in-india, region: ap-south-1 }
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: hawk-eye
        app.kubernetes.io/name: spire-server
        data-residency: in-india
        region: ap-south-1
    spec:
      serviceAccountName: spire-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: spire-server
          # Pin: deploy/versions.bom.yaml :: infra_extra.spire_server
          image: ghcr.io/spiffe/spire-server:1.11.0
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - containerPort: 8081
              name: grpc
          livenessProbe:
            httpGet: { path: /live, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet: { path: /ready, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
      volumes:
        - name: spire-config
          configMap:
            name: spire-server
  volumeClaimTemplates:
    - metadata:
        name: spire-data
        labels: { app.kubernetes.io/part-of: hawk-eye }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
