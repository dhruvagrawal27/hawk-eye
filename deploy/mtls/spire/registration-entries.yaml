# =============================================================================
# Hawk-Eye — SPIRE registration entries: one SPIFFE ID per service (SCAFFOLD)
# Owner: PLATFORM (Laptop 06)  ·  Task: PLATFORM-11  ·  Blueprint: Part 26.2 (mTLS),
#        Part 9.3, Part 19.3 (NO shared/anonymous accounts), Part 16 (in-India residency)
# -----------------------------------------------------------------------------
# SCAFFOLD. Declarative SPIRE registration (spire-controller-manager CRD
# `ClusterSPIFFEID`) mapping each platform service (CONTEXT.md §7) to its identity
#   spiffe://hawk-eye/ns/<ns>/sa/<service>
# bound to the pod running under the matching ServiceAccount (./service-accounts.yaml).
#
# These are the SAME SPIFFE IDs the dev CA (./gen-certs.sh) bakes into cert SAN URIs,
# so the local mTLS and the real fabric agree byte-for-byte. ONE entry per service;
# no two services share an identity (Part 19.3 — the privileged-user anti-pattern
# Hawk-Eye exists to catch). 23 services total.
#
# Apply on the real cluster after the controller manager is installed; plan-only.
# (Equivalent imperative form: `spire-server entry create -spiffeID <id>
#  -parentID spiffe://hawk-eye/ns/spire/sa/spire-agent -selector k8s:sa:<service>`.)
# =============================================================================
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: kafka
  labels: { app.kubernetes.io/part-of: hawk-eye, data-residency: in-india, region: ap-south-1 }
spec:
  # Bind the SPIFFE ID to the pod that runs under ServiceAccount 'kafka'
  # (./service-accounts.yaml). ONE identity per service — no shared accounts (Part 19.3).
  spiffeIDTemplate: "spiffe://hawk-eye/ns/{{ .PodMeta.Namespace }}/sa/kafka"
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  namespaceSelector:
    matchLabels:
      app.kubernetes.io/part-of: hawk-eye
  ttl: 1h
---
