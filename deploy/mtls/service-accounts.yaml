# =============================================================================
# Hawk-Eye — per-service Kubernetes ServiceAccounts (least-privilege identities)
# Owner: PLATFORM (Laptop 06)  ·  Task: PLATFORM-11  ·  Blueprint: Part 26.2 (IAM/mTLS),
#        Part 9.3, Part 19.3 (NO shared / anonymous accounts)
# -----------------------------------------------------------------------------
# ONE ServiceAccount per service (CONTEXT.md §7). Each SA is the Kubernetes anchor
# for that service's SPIFFE identity  spiffe://hawk-eye/ns/default/sa/<service>
# (see ./gen-certs.sh for dev certs and ./spire/registration-entries.yaml for the
# SPIRE mapping). No workload uses the cluster `default` ServiceAccount; no SA is
# shared between two services — the exact privileged-user anti-pattern Hawk-Eye
# exists to catch (Part 19.3).
#
# Least privilege:
#   * automountServiceAccountToken: false everywhere by default — a workload only
#     gets an API token if it actually calls the Kubernetes API (none of these do;
#     their identity is the SPIFFE SVID, not the k8s token). This denies token
#     theft → API access by default.
#   * NO RoleBindings are granted here. These SAs carry *identity only*. Any RBAC a
#     service genuinely needs is added explicitly, per-service, under four-eyes.
#   * Cloud IAM least-privilege roles (IRSA / no long-lived keys) live in the
#     Terraform iam module: infra/terraform/modules/iam/ (owned by the Terraform
#     workstream — referenced here, NOT created here).
#
# Residency labels (Part 16) are stamped on every SA so policy-as-code (OPA/Conftest)
# can assert in-India placement uniformly.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    app.kubernetes.io/part-of: hawk-eye
    data-residency: in-india
    region: ap-south-1
---
# --- edge / app zone ---------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: default
  labels: { app.kubernetes.io/part-of: hawk-eye, hawk-eye.zone: app, data-residency: in-india, region: ap-south-1 }
  annotations: { spiffe.io/spiffe-id: "spiffe://hawk-eye/ns/default/sa/backend" }
automountServiceAccountToken: false
