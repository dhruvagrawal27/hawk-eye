# --- Security / DevSecOps tooling (PLATFORM-17/20/21/22) — pin & CVE-track ----
security_tools:
  syft:      { version: "1.18.1", role: "SBOM (SPDX + CycloneDX)" }
  grype:     { version: "0.86.1", role: "CVE scan" }
  trivy:     { version: "0.58.1", role: "container + IaC + CVE scan" }
  semgrep:   { version: "1.97.0", role: "SAST" }
  gitleaks:  { version: "8.21.2", role: "secrets scan" }
  trufflehog: { version: "3.86.0", role: "secrets scan (deep)" }
  cosign:    { version: "2.4.1",  role: "artifact + model signing/verify" }
  owasp_zap: { version: "2.15.0", image: "zaproxy/zap-stable:2.15.0", role: "DAST" }
  conftest:  { version: "0.56.0", role: "OPA policy test (residency/zero-trust)" }
  tfsec:     { version: "1.28.13", role: "Terraform static analysis" }
  checkov:   { version: "3.2.334", role: "IaC scan (defence in depth)" }
  softhsm2:  { version: "2.6.1",  role: "mock HSM (PKCS#11)" }

# --- Test / perf / chaos tooling (PLATFORM-21/24/27) -------------------------
