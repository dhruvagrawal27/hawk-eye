  locust:     { version: "2.32.4", pip: "locust==2.32.4", role: "load (alt)" }
  playwright: { version: "1.49.1", role: "investigator UAT (PLATFORM-24)" }
  pumba:      { version: "0.11.6", image: "gaiaadm/pumba:0.11.6", role: "chaos (container kill)" }
  pytest:     { version: "8.3.4", pip: "pytest==8.3.4", role: "unit/integration/contract" }

