meta:
  bom_version: "1.0.0"
  generated_for: "Hawk-Eye insider-fraud detection platform"
  blueprint_ref: "Part 24.3 (l.917-943)"
  deployment_target_note: >
    Demo/pilot deployment target is AWS Lightsail (see docs/adr/ADR-0001-ec2-in-vpc.md);
    production-shaped pilot = EC2-in-VPC; production = on-prem in-India (Part 9.3, Part 16).
    Terraform `target` variable accepts: aws | onprem | lightsail.

# --- Blueprint Part 24.3 pins (the canonical stack) --------------------------
stack:
  kafka:
    pin: "3.8.x"
    patch: "3.8.1"
    image: "apache/kafka:3.8.1"      # KRaft mode, single broker for dev
    role: "event ingestion"
  flink:
    pin: "1.20.x"
    patch: "1.20.0"
    image: "flink:1.20.0-scala_2.12-java17"
    role: "stateful streaming / CEP"
  clickhouse:
    pin: "25.x"
    patch: "25.3"
    image: "clickhouse/clickhouse-server:25.3"
    role: "analytics / investigation store"
    owner: "DATABASE (PLATFORM hosts the container)"
  redis:
    pin: "7.4.x"
    patch: "7.4.1"
    image: "redis:7.4.1-alpine"
    role: "online feature store / cache"
    owner: "DATABASE (PLATFORM hosts the container)"
  feast:
    pin: "0.40.x"
    patch: "0.40.1"
    pip: "feast==0.40.1"
    role: "feature store (train/serve parity)"
    owner: "DATA defines; PLATFORM hosts sidecar"
  postgres:
    pin: "17.x"
    patch: "17.2"
    image: "postgres:17.2"
    role: "app metadata + governance DB"
  python:
    pin: "3.12.x"
    patch: "3.12.7"
    image: "python:3.12.7-slim"
    role: "platform services + tools"
  onnxruntime:
    pin: "1.20.x"
    patch: "1.20.1"
    pip: "onnxruntime==1.20.1"
    role: "model serving (CPU inference)"
  triton:
    pin: "25.x"
    patch: "25.01"
    image: "nvcr.io/nvidia/tritonserver:25.01-py3"   # GPU image; dev uses CPU serving stub
    role: "model serving (GPU path)"
    owner: "ML packages models; PLATFORM hosts container"
  fastapi:
    pin: "0.115.x"
    patch: "0.115.6"
    pip: "fastapi==0.115.6"
  uvicorn:
    pin: "0.32.x"
    patch: "0.32.1"
    pip: "uvicorn[standard]==0.32.1"
  react:
    pin: "19.x"
    patch: "19.0.0"
    owner: "FRONTEND (PLATFORM uses for Playwright UAT harness)"
  typescript:
    pin: "5.6.x"
    patch: "5.6.3"
  node:
    pin: "22.x"
    patch: "22.12.0"
    image: "node:22.12.0-bookworm-slim"
  mlflow:
    pin: "2.18.x"
    patch: "2.18.0"
    image: "ghcr.io/mlflow/mlflow:v2.18.0"
    role: "model registry/tracking"
    owner: "ML owns content; PLATFORM hosts container"
  airflow:
    pin: "2.10.x"
    patch: "2.10.4"
    image: "apache/airflow:2.10.4"
    role: "orchestration"
  opa:
    pin: "8.x (Drools) / OPA"
    patch: "0.70.0"
    image: "openpolicyagent/opa:0.70.0"
    role: "zero-trust / SoD / residency policy (we use OPA, not Drools)"
  keycloak:
    pin: "25.x"
    patch: "25.0.6"
    image: "quay.io/keycloak/keycloak:25.0.6"
    role: "OIDC/OAuth2 identity"
  evidently:
    pin: "0.4.x"
    patch: "0.4.40"
    pip: "evidently==0.4.40"
    owner: "ML uses; PLATFORM hosts"
  prometheus:
    pin: "3.x"
    patch: "3.0.1"
