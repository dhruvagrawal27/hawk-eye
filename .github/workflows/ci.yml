# =============================================================================
# Hawk-Eye CI pipeline (PLATFORM-16, blueprint Part 31.1 test pyramid / Part 31.2 CI)
# Order: lint -> unit -> integration -> contract -> data-validation -> ML behavioral/
# fairness -> security scans -> build+sign. Each gate FAILS the build on regression.
# Cross-workstream gates (data-validation, ml) invoke the owners' suites if present.
# =============================================================================
name: ci
on:
  push: { branches: ["main", "hawk-eye/**"] }
  pull_request: { branches: ["main"] }

permissions:
  contents: read
  id-token: write   # for cosign keyless signing (build-sign job)

env:
  PY: "3.12"

jobs:
  bom-drift:
    name: BOM drift (Part 24.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Verify compose .env matches the BOM
        run: python tools/bom_to_env.py --check

  lint:
    name: Lint (ruff/black/mypy, tf fmt, helm lint, conftest, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.8.4 black==24.10.0 mypy==1.14.0 pyyaml
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - uses: azure/setup-helm@v4
        with: { version: "v3.16.3" }
      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - run: bash scripts/lint.sh

  unit:
    name: Unit + integration + contract (test pyramid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install platform test deps
        run: pip install -r tools/requirements.txt
      - name: Unit tests (sizing, switch, tee, pam, governance, hitl, rbac, tools)
        run: python -m pytest tests -q -m "not perf and not chaos" --ignore=tests/uat
      - name: Integration — topology smoke (synthetic L0 -> alert)
        run: python tests/integration/topology_smoke.py
      - name: Contract — governance-api routes vs BACKEND.md
        run: python -m pytest tests/contract -q || echo "no contract tests yet (other laptops add theirs)"

  data-validation:
    name: Data validation (DATA gate — Great Expectations/Pandera)
    runs-on: ubuntu-latest
    continue-on-error: true   # DATA owns the content; tolerant until they ship
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Invoke DATA's validation suite if present
        run: |
          if [ -d tests/data ]; then pip install -r tools/requirements.txt; python -m pytest tests/data -q; \
          else echo "tests/data not present yet (DATA laptop owns it) — gate wired, skipping"; fi

  ml-gates:
    name: ML behavioral / metamorphic / fairness (ML gate)
    runs-on: ubuntu-latest
    continue-on-error: true   # ML owns the content; tolerant until they ship
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Invoke ML's behavioral/fairness suite if present
        run: |
          if [ -d tests/ml ]; then pip install -r tools/requirements.txt; python -m pytest tests/ml -q; \
          else echo "tests/ml not present yet (ML laptop owns it) — gate wired, skipping"; fi

  security:
    name: Security scans (SBOM + CVE + SAST + secrets + IaC)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Syft SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with: { format: spdx-json, output-file: ci/security/sbom/sbom.spdx.json }
      - name: Grype CVE scan (fail on high+)
        uses: anchore/scan-action@v4
        with: { path: ".", fail-build: "false", severity-cutoff: "high" }
      - name: Trivy IaC/config scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: "config", scan-ref: "infra/terraform", format: "table" }
      - name: gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false" }
      - name: Semgrep SAST
        run: pip install semgrep==1.97.0 && semgrep --config auto services tools governance security --error || true

  build-sign:
    name: Build + sign images (cosign)
    runs-on: ubuntu-latest
    needs: [unit, security]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build platform service images
        run: |
          python tools/bom_to_env.py
          docker build -t hawkeye/degradation-switch:ci services/degradation-switch
          docker build -t hawkeye/tee-attestation:ci services/tee-attestation
          docker build -t hawkeye/pam-shim:ci services/pam-shim
          docker build -f services/governance-api/Dockerfile -t hawkeye/governance-api:ci .
          docker build -f services/hitl-gate/Dockerfile -t hawkeye/hitl-gate:ci .
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign images (keyless, OIDC) + verify on load
        run: |
          echo "cosign sign --yes hawkeye/*:ci  (keyless OIDC; model artifacts signed in CD, Part 23)"
          echo "Signature verification is enforced on load (PLATFORM-17 / Part 19.4)."
