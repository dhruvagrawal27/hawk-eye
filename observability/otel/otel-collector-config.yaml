# OpenTelemetry Collector config (PLATFORM-29, blueprint Part 30.2).
# Traces the event -> feature -> score -> alert path end-to-end so a slow/wrong alert can be
# debugged. Receives OTLP from every service; exports traces (to a backend) + metrics to
# Prometheus. Structured logs go to ClickHouse/OpenSearch (distinct from the immutable audit).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  resource:
    attributes:
      - { key: platform, value: hawk-eye, action: upsert }
      - { key: data_residency, value: in-india, action: upsert }   # Part 16
  # tail-sampling keeps all error/slow traces (debug a wrong alert) + a sample of the rest
  tail_sampling:
    decision_wait: 5s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow, type: latency, latency: { threshold_ms: 250 } }
      - { name: sample, type: probabilistic, probabilistic: { sampling_percentage: 10 } }

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889       # scraped by Prometheus (job otel-collector)
  debug: { verbosity: basic }
  # otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }   # trace backend (prod)

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
  telemetry:
    logs: { level: info }
