# =============================================================================
# Hawk-Eye SLO / SLI definitions + error budgets (PLATFORM-29, blueprint Part 30.2)
# Error budgets gate change velocity (Part 31.2 CD auto-rollback reads these).
# =============================================================================
service: hawk-eye-alert-pipeline
slos:
  - name: pipeline-availability
    objective: 99.9          # % over 30d
    sli: "ratio of successful event->alert pipeline runs"
    window: 30d
    error_budget: 0.1        # % (43.2 min/30d)
    indicator_query: "sum(rate(degradation_scored_total[5m])) / clamp_min(sum(rate(degradation_scored_total[5m])) + sum(rate(hawkeye_pipeline_errors_total[5m])), 1)"

  - name: p99-scoring-latency
    objective_ms: 250        # p99 budget at target TPS (Part 31.1 perf gate ties here)
    sli: "p99 of event->score latency"
    window: 30d
    indicator_query: "histogram_quantile(0.99, sum by (le) (rate(serving_infer_latency_seconds_bucket[5m]))) * 1000"

  - name: alert-delivery-freshness
    objective_s: 60          # alert lands within 60s of the triggering event
    sli: "p95 event-ts to alert-ts"
    window: 30d

  - name: audit-log-completeness
    objective: 100.0         # audit RPO ~= 0; never drop an audit entry (Part 19.3)
    sli: "ratio of actions with a persisted audit record"
    window: 30d
    error_budget: 0.0

# Golden signals tracked per component (latency, traffic, errors, saturation — Part 30.2).
golden_signals_components:
  - kafka
  - flink
  - serving
  - degradation-switch
  - backend
  - clickhouse
  - governance-api
  - hitl-gate

# Error-budget policy: when a 30d budget is >50% burned, change velocity is throttled
# (canary steps paused); >100% burned freezes non-emergency changes (Part 30.2).
error_budget_policy:
  warn_at_burn: 0.5
  freeze_at_burn: 1.0
  emergency_path: "PLATFORM-30 incident/emergency-change (CAB-expedited)"
